<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BananaVision - Deteksi Penyakit Pohon Pisang dengan AI</title>
    <meta name="description" content="Aplikasi deteksi penyakit pohon pisang menggunakan teknologi AI. Dapatkan hasil analisis instan dan rekomendasi treatment yang akurat." />
    
    <link rel="icon" type="image/x-icon" href="/bananavision.png" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BananaVision" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 
      Tangkap event beforeinstallprompt sedini mungkin, sebelum React mount.
      Disimpan di window.__deferredInstallPrompt agar komponen React bisa pakai.
    -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        const isMobile = /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
        if (!isMobile) return;
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        console.log('[PWA] beforeinstallprompt captured early');
      });
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
